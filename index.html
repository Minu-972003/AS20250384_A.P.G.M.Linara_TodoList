
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">My To-Do List</span>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="todo-container">

            <h2 class="text-center">Task Manager</h2>
            <p class="text-center text-muted">Organize your tasks and stay productive.</p>

            <div class="input-group mb-3">
                <input type="text" id="taskInput" class="form-control"
                    placeholder="Enter a new task...">
                <button class="btn btn-primary" id="addBtn">Add Task</button>
            </div>

            <p id="errorMessage" class="text-danger"></p>

            <div class="d-flex justify-content-between">
                <span>Your tasks</span>
                <span class="badge bg-primary" id="taskCounter">0 remaining</span>
            </div>

            <div class="btn-group w-100 my-3">
                <button class="btn btn-outline-primary active" data-filter="all">All</button>
                <button class="btn btn-outline-primary" data-filter="active">Active</button>
                <button class="btn btn-outline-primary" data-filter="completed">Completed</button>
            </div>

            <ul id="taskList" class="list-group"></ul>

            <div class="text-end mt-3">
                <button class="btn btn-outline-danger btn-sm" id="clearBtn">
                    Clear Completed
                </button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
